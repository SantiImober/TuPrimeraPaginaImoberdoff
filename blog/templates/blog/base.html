<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mi Blog{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }

        nav {
            background: #2c3e50;
            padding: 15px 30px;
            display: flex;
            gap: 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover { color: #3498db; }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h1 { margin-bottom: 20px; color: #2c3e50; }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        form p { margin-bottom: 12px; }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #2c3e50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #3498db; }

        a { color: #3498db; }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            color: #999;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <nav>
        <a href="/">Inicio</a>
        <a href="/posts/">Posts</a>
        <a href="/autores/">Autores</a>
        <a href="/categorias/">Categorías</a>
        <a href="/buscar/">Buscar</a>
        <a href="/posts/nuevo/">+ Nuevo Post</a>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Mi Blog - Django 2024</p>
    </footer>

</body>
</html>
